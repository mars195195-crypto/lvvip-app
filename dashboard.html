<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>L-VVIP 總管理儀表板</title>
  <style>
    html,body{
      margin:0;
      min-height:100%;
      background:#07111f;
      color:#fff;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;
    }
    .loading{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      text-align:center;
      box-sizing:border-box;
    }
    .box{
      width:min(100%,420px);
      padding:24px;
      border:1px solid rgba(255,255,255,.12);
      border-radius:18px;
      background:rgba(255,255,255,.05);
      box-sizing:border-box;
    }
    .brand{color:#f1cf72;font-weight:900;font-size:24px}
    .title{font-size:28px;font-weight:900;margin:6px 0 12px}
    .msg{color:#a7b5c0;line-height:1.7}
    .retry{
      display:none;
      width:100%;
      margin-top:16px;
      padding:13px;
      border:0;
      border-radius:11px;
      background:#f1cf72;
      color:#16222b;
      font-weight:900;
    }
  </style>
</head>
<body>
  <div id="loading" class="loading">
    <div class="box">
      <div class="brand">L-VVIP</div>
      <div class="title">總管理儀表板</div>
      <div id="message" class="msg">正在載入完整管理功能…</div>
      <button id="retry" class="retry" type="button">重新載入</button>
    </div>
  </div>

  <script>
    (async function () {
      const message = document.getElementById("message");
      const retry = document.getElementById("retry");

      retry.addEventListener("click", () => location.reload());

      try {
        const response = await fetch("./dashboard-v17.html?v=20260915-01", {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const html = await response.text();

        if (!html || !html.includes("總管理儀表板")) {
          throw new Error("完整管理頁內容不正確");
        }

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        console.error(error);
        message.textContent =
          "完整管理介面載入失敗，請確認 dashboard-v17.html 仍在 GitHub 專案中。";
        retry.style.display = "block";
      }
    })();
  </script>
</body>
</html>
