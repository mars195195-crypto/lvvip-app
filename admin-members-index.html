<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>L-VVIP 會員管理</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#061522;--panel:#102230;--panel2:#0b2030;--line:#294357;
  --text:#f4f7f9;--muted:#91a4b1;--gold:#efd16e;--blue:#173b55;
  --danger:#7a3f45;--ok:#1f5b43;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
body{min-height:100vh}
button,input{font:inherit}
.shell{width:min(100%,880px);margin:auto;padding:18px 16px 40px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.brand{color:var(--gold);font-weight:900;font-size:22px}
.title{font-size:30px;font-weight:900;margin:4px 0 2px}
.sub{color:var(--muted);font-size:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);border-radius:12px;padding:11px 14px;background:var(--blue);color:#fff;font-weight:900}
.btn.gold{border:0;background:linear-gradient(90deg,#d8b95a,#f4dd8d);color:#17212a}
.btn.danger{background:var(--danger)}
.panel{background:linear-gradient(180deg,#132633,#0e202d);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:16px;margin-bottom:14px}
.panel-title{font-size:21px;font-weight:900;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
label{color:var(--muted);font-size:13px}
input{width:100%;min-width:0;border:1px solid var(--line);border-radius:11px;background:#071724;color:#fff;padding:12px 13px;outline:none}
input:focus{border-color:#d7b85b}
.message{min-height:22px;margin-top:8px;font-size:13px;line-height:1.5}
.message.ok{color:#76e0a0}.message.bad{color:#ff9b9b}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:rgba(255,255,255,.035);border-radius:12px;padding:12px}
.stat b{font-size:24px;display:block;margin-top:4px}
.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.filter{border:1px solid var(--line);border-radius:10px;padding:9px 6px;background:#123047;color:#fff;font-weight:900}
.filter.active{background:linear-gradient(90deg,#d8b95a,#f4dd8d);color:#17212a}
.searchrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:12px}
.cards{display:grid;grid-template-columns:1fr;gap:12px}
.card{background:var(--panel2);border:1px solid rgba(255,255,255,.08);border-radius:15px;padding:14px}
.cardhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.name{font-size:20px;font-weight:900}
.ref{color:var(--gold);font-weight:900}
.meta{color:var(--muted);font-size:13px;line-height:1.6;margin:8px 0 12px}
.badge{display:inline-flex;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900;margin-right:6px}
.badge.ok{background:#184a38;color:#bff8d5}.badge.off{background:#50343a;color:#ffd0d4}.badge.line{background:#173b55;color:#d7edf9}.badge.miss{background:#4f451f;color:#ffe99a}
.editgrid{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:9px}
.pwgrid{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:9px}
.smallbtn{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#173b55;color:#fff;font-weight:900}
.smallbtn.danger{background:var(--danger)}
.cardmsg{min-height:18px;margin-top:8px;font-size:12px;color:var(--muted)}
.login{max-width:560px;margin:10vh auto 0}
.hidden{display:none!important}
.note{color:var(--muted);font-size:12px;line-height:1.6}
@media(max-width:560px){
  .shell{padding:14px 12px 28px}
  .topbar{align-items:flex-start;flex-direction:column}
  .title{font-size:27px}
  .grid,.stats{grid-template-columns:1fr}
  .filters{grid-template-columns:1fr 1fr}
  .searchrow,.editgrid,.pwgrid{grid-template-columns:1fr}
  .btn,.smallbtn{min-height:46px}
}
</style>
</head>
<body>
<div class="shell">

<section id="loginView" class="login">
  <div class="panel">
    <div class="brand">L-VVIP</div>
    <div class="title">會員管理</div>
    <div class="sub">使用總管理員 Supabase 帳號登入</div>
    <form id="loginForm" style="margin-top:16px">
      <div class="field">
        <label>Email</label>
        <input id="loginEmail" type="email" autocomplete="username" required>
      </div>
      <div class="field" style="margin-top:10px">
        <label>密碼</label>
        <input id="loginPassword" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn gold" style="width:100%;margin-top:14px" type="submit">登入會員管理</button>
      <div id="loginMessage" class="message"></div>
    </form>
  </div>
</section>

<section id="appView" class="hidden">
  <div class="topbar">
    <div>
      <div class="brand">L-VVIP</div>
      <div class="title">會員管理中心</div>
      <div id="adminInfo" class="sub"></div>
    </div>
    <div class="actions">
      <button id="backDashboard" class="btn">返回總管理</button>
      <button id="reloadBtn" class="btn">重新整理</button>
      <button id="logoutBtn" class="btn danger">登出</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">新增會員</div>
    <div class="note">推薦碼由系統自動產生，不需要手動填寫。</div>
    <form id="createForm" class="grid" style="margin-top:12px">
      <div class="field">
        <label>會員名稱</label>
        <input id="createName" maxlength="80" required>
      </div>
      <div class="field">
        <label>Email</label>
        <input id="createEmail" type="email" required>
      </div>
      <div class="field full">
        <label>初始密碼（8～72 字元）</label>
        <input id="createPassword" type="password" minlength="8" maxlength="72" required>
      </div>
      <div class="field full">
        <button id="createBtn" class="btn gold" type="submit">＋ 建立會員</button>
      </div>
    </form>
    <div id="createMessage" class="message"></div>
  </div>

  <div class="panel">
    <div class="panel-title">會員清單</div>
    <div class="stats">
      <div class="stat"><span>會員總數</span><b id="statTotal">0</b></div>
      <div class="stat"><span>啟用</span><b id="statActive">0</b></div>
      <div class="stat"><span>停用</span><b id="statInactive">0</b></div>
      <div class="stat"><span>未設定 LINE</span><b id="statLineMissing">0</b></div>
    </div>

    <div class="filters">
      <button class="filter active" data-filter="all">全部</button>
      <button class="filter" data-filter="active">啟用</button>
      <button class="filter" data-filter="inactive">停用</button>
      <button class="filter" data-filter="lineMissing">未設定 LINE</button>
    </div>

    <div class="searchrow">
      <input id="searchInput" type="search" placeholder="搜尋名稱、Email、推薦碼">
      <button id="clearSearch" class="btn" type="button">清除</button>
    </div>

    <div id="cards" class="cards"></div>
  </div>
</section>

</div>

<script>
const SUPABASE_URL="https://rwtbrjhgpufmkcdltjge.supabase.co";
const SUPABASE_KEY="sb_publishable_j7YAOitklhJeq79wu5N0sQ_xRuo_jfI";
const FUNCTION_NAME="admin-members";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const dateTW=v=>v?new Date(v).toLocaleString("zh-TW",{timeZone:"Asia/Taipei",hour12:false}):"-";

let members=[];
let selectedFilter="all";
let searchText="";

function showLogin(msg=""){
  $("loginView").classList.remove("hidden");
  $("appView").classList.add("hidden");
  $("loginMessage").textContent=msg;
  $("loginMessage").className=msg?"message bad":"message";
}
function showApp(){
  $("loginView").classList.add("hidden");
  $("appView").classList.remove("hidden");
}
async function invokeAdmin(body){
  const {data,error}=await db.functions.invoke(FUNCTION_NAME,{body});
  if(error){
    let message=error.message||"Edge Function 呼叫失敗";
    try{
      if(error.context){
        const detail=await error.context.clone().json();
        message=detail?.error||detail?.message||message;
      }
    }catch(_){}
    throw new Error(message);
  }
  if(!data?.ok) throw new Error(data?.error||"操作失敗");
  return data;
}
function updateStats(){
  const total=members.length;
  const active=members.filter(x=>x.active).length;
  const inactive=total-active;
  const missing=members.filter(x=>!x.line_ready).length;
  $("statTotal").textContent=total;
  $("statActive").textContent=active;
  $("statInactive").textContent=inactive;
  $("statLineMissing").textContent=missing;

  document.querySelectorAll("[data-filter]").forEach(btn=>{
    const key=btn.dataset.filter;
    const count=key==="all"?total:key==="active"?active:key==="inactive"?inactive:missing;
    const label=key==="all"?"全部":key==="active"?"啟用":key==="inactive"?"停用":"未設定 LINE";
    btn.textContent=`${label} ${count}`;
  });
}
function filteredMembers(){
  const q=searchText.trim().toLowerCase();
  return members.filter(m=>{
    if(selectedFilter==="active"&&!m.active)return false;
    if(selectedFilter==="inactive"&&m.active)return false;
    if(selectedFilter==="lineMissing"&&m.line_ready)return false;
    if(!q)return true;
    return [m.display_name,m.email,m.ref_code].join(" ").toLowerCase().includes(q);
  });
}
function render(){
  updateStats();
  const rows=filteredMembers();
  $("cards").innerHTML=rows.map(m=>`
    <div class="card" data-card="${esc(m.id)}">
      <div class="cardhead">
        <div>
          <div class="name">${esc(m.display_name||"-")}</div>
          <div class="meta">${esc(m.email||"-")}<br>加入：${dateTW(m.created_at)}</div>
        </div>
        <div class="ref">${esc(m.ref_code||"-")}</div>
      </div>

      <div>
        <span class="badge ${m.active?"ok":"off"}">${m.active?"啟用":"停用"}</span>
        <span class="badge ${m.line_ready?"line":"miss"}">${m.line_ready?"LINE 已設定":"LINE 未設定"}</span>
      </div>

      <div class="meta">${m.line_url?`LINE：${esc(m.line_url)}`:""}</div>

      <div class="editgrid">
        <input data-name-input value="${esc(m.display_name||"")}" maxlength="80">
        <button class="smallbtn" data-save-name="${esc(m.id)}">儲存名稱</button>
      </div>

      <div class="editgrid">
        <div class="note">目前狀態：${m.active?"啟用":"停用"}</div>
        <button class="smallbtn ${m.active?"danger":""}" data-toggle-active="${esc(m.id)}">
          ${m.active?"停用會員":"重新啟用"}
        </button>
      </div>

      <div class="pwgrid">
        <input data-password-input type="password" minlength="8" maxlength="72" placeholder="輸入新密碼">
        <button class="smallbtn" data-reset-password="${esc(m.id)}">重設密碼</button>
      </div>

      <div class="cardmsg" data-msg="${esc(m.id)}"></div>
    </div>
  `).join("")||`<div class="note">沒有符合條件的會員。</div>`;
}
async function loadMembers(){
  $("reloadBtn").disabled=true;
  try{
    const data=await invokeAdmin({action:"list"});
    members=data.members||[];
    $("adminInfo").textContent=`${data.admin_email||""}｜管理員`;
    showApp();

    const ref=new URLSearchParams(location.search).get("ref");
    if(ref&&!searchText){
      searchText=ref;
      $("searchInput").value=ref;
    }
    render();
  }catch(err){
    const msg=err.message||String(err);
    if(/jwt|auth|unauthor|登入|permission|admin/i.test(msg)){
      showLogin("請使用管理員帳號登入："+msg);
    }else{
      showApp();
      $("adminInfo").textContent="管理員";
      $("cards").innerHTML=`<div class="message bad">無法載入會員：${esc(msg)}<br><br>若顯示 Function not found，請先把 admin-members-index.ts 部署為 Supabase Edge Function「admin-members」。</div>`;
    }
  }finally{
    $("reloadBtn").disabled=false;
  }
}

$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();
  $("loginMessage").textContent="登入中...";
  $("loginMessage").className="message";
  const {error}=await db.auth.signInWithPassword({
    email:$("loginEmail").value.trim(),
    password:$("loginPassword").value
  });
  if(error){
    $("loginMessage").textContent="登入失敗："+error.message;
    $("loginMessage").className="message bad";
    return;
  }
  await loadMembers();
});

$("createForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const btn=$("createBtn");
  btn.disabled=true;
  $("createMessage").textContent="建立中...";
  $("createMessage").className="message";
  try{
    const data=await invokeAdmin({
      action:"create",
      email:$("createEmail").value.trim(),
      password:$("createPassword").value,
      display_name:$("createName").value.trim()
    });
    $("createMessage").textContent=`建立成功：${data.member?.ref_code||""}`;
    $("createMessage").className="message ok";
    $("createForm").reset();
    await loadMembers();
  }catch(err){
    $("createMessage").textContent="建立失敗："+err.message;
    $("createMessage").className="message bad";
  }finally{
    btn.disabled=false;
  }
});

document.querySelectorAll("[data-filter]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll("[data-filter]").forEach(x=>x.classList.remove("active"));
    btn.classList.add("active");
    selectedFilter=btn.dataset.filter;
    render();
  });
});
$("searchInput").addEventListener("input",e=>{searchText=e.target.value||"";render()});
$("clearSearch").addEventListener("click",()=>{$("searchInput").value="";searchText="";render()});

$("cards").addEventListener("click",async e=>{
  const nameBtn=e.target.closest("[data-save-name]");
  const toggleBtn=e.target.closest("[data-toggle-active]");
  const pwBtn=e.target.closest("[data-reset-password]");
  const btn=nameBtn||toggleBtn||pwBtn;
  if(!btn)return;

  const id=nameBtn?.dataset.saveName||toggleBtn?.dataset.toggleActive||pwBtn?.dataset.resetPassword;
  const member=members.find(x=>x.id===id);
  const card=e.target.closest("[data-card]");
  const msg=card?.querySelector("[data-msg]");
  if(!member||!card)return;

  btn.disabled=true;
  if(msg){msg.textContent="處理中...";msg.style.color="#91a4b1"}

  try{
    if(nameBtn){
      const display_name=card.querySelector("[data-name-input]").value.trim();
      await invokeAdmin({action:"update",member_id:id,display_name});
    }
    if(toggleBtn){
      await invokeAdmin({action:"update",member_id:id,active:!member.active});
    }
    if(pwBtn){
      const new_password=card.querySelector("[data-password-input]").value;
      if(new_password.length<8) throw new Error("新密碼至少 8 個字元");
      if(!confirm(`確定要重設 ${member.display_name||member.ref_code} 的密碼嗎？`))return;
      await invokeAdmin({action:"reset_password",member_id:id,new_password});
      card.querySelector("[data-password-input]").value="";
    }
    if(msg){msg.textContent="✓ 已完成";msg.style.color="#76e0a0"}
    await loadMembers();
  }catch(err){
    if(msg){msg.textContent="失敗："+err.message;msg.style.color="#ff9b9b"}
  }finally{
    btn.disabled=false;
  }
});

$("reloadBtn").addEventListener("click",loadMembers);
$("logoutBtn").addEventListener("click",async()=>{await db.auth.signOut();location.href="dashboard-v17.html"});
$("backDashboard").addEventListener("click",()=>{location.href="dashboard-v17.html"});

(async()=>{
  const {data:{session}}=await db.auth.getSession();
  if(session) await loadMembers();
  else showLogin();
})();
</script>
</body>
</html>
